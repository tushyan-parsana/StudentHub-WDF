<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A sleek, modern calculator built with vanilla HTML, CSS and JavaScript DOM manipulation." />
  <title>Calculator — Slim &amp; Stylish</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="calc-wrapper" id="calcWrapper">
    <div class="calc-display" id="calcDisplay">
      <span class="calc-expression" id="calcExpression"></span>
      <span class="calc-result" id="calcResult">0</span>
    </div>

    <div class="calc-keys" id="calcKeys">
      <!-- Row 1 -->
      <button class="key key--fn" id="keyClear" data-action="clear">AC</button>
      <button class="key key--fn" id="keyToggle" data-action="toggle">+/−</button>
      <button class="key key--fn" id="keyPercent" data-action="percent">%</button>
      <button class="key key--op" id="keyDivide" data-action="operator" data-value="/">÷</button>

      <!-- Row 2 -->
      <button class="key" id="key7" data-action="number" data-value="7">7</button>
      <button class="key" id="key8" data-action="number" data-value="8">8</button>
      <button class="key" id="key9" data-action="number" data-value="9">9</button>
      <button class="key key--op" id="keyMultiply" data-action="operator" data-value="*">×</button>

      <!-- Row 3 -->
      <button class="key" id="key4" data-action="number" data-value="4">4</button>
      <button class="key" id="key5" data-action="number" data-value="5">5</button>
      <button class="key" id="key6" data-action="number" data-value="6">6</button>
      <button class="key key--op" id="keySubtract" data-action="operator" data-value="-">−</button>

      <!-- Row 4 -->
      <button class="key" id="key1" data-action="number" data-value="1">1</button>
      <button class="key" id="key2" data-action="number" data-value="2">2</button>
      <button class="key" id="key3" data-action="number" data-value="3">3</button>
      <button class="key key--op" id="keyAdd" data-action="operator" data-value="+">+</button>

      <!-- Row 5 -->
      <button class="key key--wide" id="key0" data-action="number" data-value="0">0</button>
      <button class="key" id="keyDot" data-action="decimal" data-value=".">.</button>
      <button class="key key--eq" id="keyEquals" data-action="equals">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
