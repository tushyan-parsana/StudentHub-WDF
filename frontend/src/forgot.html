<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StudentHub</title>

    <link rel="stylesheet" href="styles/forgot.css">
</head>
<body>

    <main class="forgot-container">

        <!-- Top Back Button -->
        <header class="page-header">
            <a href="login.html" class="back-button">
                ← Back
            </a>
        </header>

        <!-- Forgot Password Form -->
        <section class="forgot-password-section">

            <!-- Profile Icon -->
            <div class="profile-icon">
                <!-- Replace with image or SVG later -->
                <img src="images/profile-placeholder.png"
                     alt="Profile Icon">
            </div>

            <form action="#" method="post">

                <div class="input-group">
                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required>
                </div>

                <button type="submit">
                    Send Reset Link
                </button>

            </form>

            <a href="login.html" class="back-link">
                ← Back to Login
            </a>

        </section>

    </main>

</body>
</html>
