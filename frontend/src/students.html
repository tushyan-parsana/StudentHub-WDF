<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management | StudentHub</title>
    <link rel="stylesheet" href="styles/students.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="dashboard.html">StudentHub</a>
        <div class="topbar-actions">
            <a href="dashboard.html">Dashboard</a>
            <a href="http://localhost/studentHub/logout.php">Logout</a>
        </div>
    </header>

    <main class="page-shell">
        <section class="page-heading">
            <div>
                <p class="eyebrow">Admin workspace</p>
                <h1>Student management</h1>
                <p>Search, filter, add, edit, and remove student records.</p>
            </div>
            <button id="new-student-button" class="primary-button" type="button">Add student</button>
        </section>

        <section class="toolbar" aria-label="Student filters">
            <label>
                Search
                <input id="search-input" type="search" placeholder="ID, name, or email">
            </label>
            <label>
                Gender
                <select id="gender-filter">
                    <option value="">All genders</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                </select>
            </label>
            <button id="clear-filters" class="secondary-button" type="button">Clear filters</button>
        </section>

        <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

        <section class="table-shell">
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Gender</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-rows"></tbody>
            </table>
        </section>
    </main>

    <dialog id="student-dialog">
        <form id="student-form" method="dialog">
            <div class="dialog-heading">
                <div>
                    <p class="eyebrow">Student record</p>
                    <h2 id="dialog-title">Add student</h2>
                </div>
                <button id="close-dialog" class="icon-button" type="button" aria-label="Close">&times;</button>
            </div>
            <label>Student ID<input id="student-id" name="student_id" required pattern="[A-Za-z0-9-]{2,30}"></label>
            <label>Full name<input id="full-name" name="full_name" required></label>
            <label>Email<input id="email" name="email" type="email" required></label>
            <label>Mobile<input id="mobile" name="mobile" inputmode="numeric" pattern="[0-9]{10}" required></label>
            <div class="form-grid">
                <label>Gender<select id="gender" name="gender" required><option value="Female">Female</option><option value="Male">Male</option><option value="Other">Other</option></select></label>
                <label>Role<select id="role" name="role" required><option value="student">Student</option><option value="admin">Admin</option></select></label>
            </div>
            <div class="dialog-actions">
                <button id="cancel-dialog" class="secondary-button" type="button">Cancel</button>
                <button class="primary-button" type="submit">Save record</button>
            </div>
        </form>
    </dialog>

    <script src="api-client.js"></script>
    <script src="students.js"></script>
</body>
</html>
