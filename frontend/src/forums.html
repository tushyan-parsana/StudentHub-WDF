<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Forums | StudentHub</title>

    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <h1>StudentHub</h1>
        </div>

        <div class="header-icons">

            <button class="notification-btn">
                🔔
            </button>

            <button class="profile-btn">
                👤
            </button>

        </div>

    </header>

    <!-- Main Layout -->
    <main class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <nav>

                <ul class="menu">

                    <li><a href="dashboard.html">Dashboard</a></li>

                    <li class="dropdown">

                        <button class="dropdown-btn">
                            Academics ▼
                        </button>

                        <ul class="submenu">

                            <li><a href="catalog.html">Catalog</a></li>

                            <li><a href="course-detail.html">My Courses</a></li>

                            <li><a href="assignments.html">Assignments</a></li>

                        </ul>

                    </li>

                    <li><a href="calender.html">Events</a></li>

                    <li><a href="career.html">Career</a></li>

                    <li><a href="forums.html">Forums</a></li>

                    <li><a href="helpdesk.html">HelpDesk</a></li>

                </ul>

            </nav>

        </aside>

        <!-- Main Content -->
        <section class="content">

            <header class="page-header">

                <h2>Student Forums</h2>

            </header>

            <!-- Tabs -->
            <section class="forum-tabs">

                <button type="button">
                    Discussion
                </button>

                <button type="button">
                    Submission
                </button>

            </section>

            <!-- Categories -->
            <section class="categories">

                <h3>Community Categories</h3>

                <div class="category-buttons">

                    <button type="button">
                        Kids
                    </button>

                    <button type="button">
                        Discussion
                    </button>

                </div>

            </section>

            <!-- Forum Posts -->
            <section class="forum-posts">

                <!-- Post 1 -->
                <article class="forum-card">

                    <div class="profile-image">

                        <img
                            src="images/profile-placeholder.png"
                            alt="User">

                    </div>

                    <div class="post-content">

                        <h3>Recently Graded Work</h3>

                        <p>Paper films</p>

                    </div>

                    <div class="post-action">

                        <button type="button">
                            Decision
                        </button>

                    </div>

                </article>

                <!-- Post 2 -->
                <article class="forum-card">

                    <div class="profile-image">

                        <img
                            src="images/profile-placeholder.png"
                            alt="User">

                    </div>

                    <div class="post-content">

                        <h3>Community Online Post</h3>

                        <p>Announcements</p>

                    </div>

                    <div class="post-action">

                        <button type="button">
                            Decision
                        </button>

                    </div>

                </article>

                <!-- Post 3 -->
                <article class="forum-card">

                    <div class="profile-image">

                        <img
                            src="images/profile-placeholder.png"
                            alt="User">

                    </div>

                    <div class="post-content">

                        <h3>Community Communication Post</h3>

                    </div>

                </article>

            </section>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
