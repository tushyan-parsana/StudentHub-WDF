<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Data Explorer | StudentHub</title>
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>
    <header class="header">
        <div class="logo"><h1>StudentHub</h1></div>
        <div class="header-icons">
            <button class="notification-btn" type="button" aria-label="Show notifications">🔔</button>
            <button class="profile-btn" type="button" aria-label="Open profile">👤</button>
        </div>
    </header>

    <main class="dashboard-container">
        <aside class="sidebar">
            <nav>
                <ul class="menu">
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="json-data.html" class="current-data-link">JSON Explorer</a></li>
                    <li class="dropdown">
                        <button class="dropdown-btn" type="button">Academics ▼</button>
                        <ul class="submenu">
                            <li><a href="catalog.html">Catalog</a></li>
                            <li><a href="course-detail.html">My Courses</a></li>
                            <li><a href="assignments.html">Assignments</a></li>
                        </ul>
                    </li>
                    <li><a href="calender.html">Events</a></li>
                    <li><a href="career.html">Career</a></li>
                    <li><a href="forums.html">Forums</a></li>
                    <li><a href="helpdesk.html">HelpDesk</a></li>
                </ul>
            </nav>
        </aside>

        <section class="content json-explorer">
            <header class="page-header">
                <div>
                    <h2>External JSON Data Explorer</h2>
                    <p>Fetch, search, filter, sort, and paginate reusable JSON data.</p>
                </div>
            </header>

            <div class="data-tabs" role="tablist" aria-label="Choose data set">
                <button type="button" class="data-tab active" data-dataset="events" role="tab" aria-selected="true">Events</button>
                <button type="button" class="data-tab" data-dataset="students" role="tab" aria-selected="false">Students</button>
                <button type="button" class="data-tab" data-dataset="faqs" role="tab" aria-selected="false">FAQs</button>
            </div>

            <section class="data-controls" aria-label="Data controls">
                <label for="data-search">Search</label>
                <input id="data-search" type="search" placeholder="Search records..." autocomplete="off">
                <label for="data-filter">Filter</label>
                <select id="data-filter">
                    <option value="all">All categories</option>
                </select>
                <label for="data-sort">Sort by</label>
                <select id="data-sort">
                    <option value="default">Default order</option>
                    <option value="asc">A to Z / earliest</option>
                    <option value="desc">Z to A / latest</option>
                </select>
            </section>

            <p id="data-status" class="data-status" role="status" aria-live="polite">Loading data...</p>
            <div id="data-list" class="data-list"></div>
            <nav class="pagination" aria-label="Data pages">
                <button id="previous-page" type="button">Previous</button>
                <span id="page-summary">Page 1</span>
                <button id="next-page" type="button">Next</button>
            </nav>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="json-data.js"></script>
</body>
</html>
